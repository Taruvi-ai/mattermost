# spec.version is overwritten with the commit SHA on every deploy by
# .github/workflows/harbor-push.yml. Set it to the currently deployed SHA
# before applying this file, or the apply will roll the server back.
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost-staging
  namespace: mattermost
spec:
  image: repo.eoxvantage.com/taruvi/mattermost
  version: ab6d09ec095ead2b190076958705ddf9d828154b
  replicas: 1
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
  - name: registrypullsecret
  ingress:
    enabled: true
    host: chatstag.taruvi.app
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
      nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
  database:
    external:
      secret: mm-db-secret
  fileStore:
    external:
      bucket: mattermost-chatstag
      secret: mm-s3-secret
      url: s3.amazonaws.com
  scheduling:
    resources:
      requests:
        cpu: 500m
        memory: 500Mi
      limits:
        cpu: '4'
        memory: 8Gi
  mattermostEnv:
  - name: MM_FILESETTINGS_AMAZONS3SSE
    value: 'true'
  - name: MM_FILESETTINGS_AMAZONS3REGION
    value: us-east-2
  - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
    value: s3.us-east-2.amazonaws.com
  - name: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
  - name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
  - name: MM_SQLSETTINGS_DATASOURCE
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_SQLSETTINGS_DATASOURCE
  - name: MM_SERVICESETTINGS_ALLOWCORSFROM
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_SERVICESETTINGS_ALLOWCORSFROM
  - name: MM_SERVICESETTINGS_COOKIESAMESITE
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_SERVICESETTINGS_COOKIESAMESITE
  - name: MM_SERVICESETTINGS_CORSALLOWCREDENTIALS
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_SERVICESETTINGS_CORSALLOWCREDENTIALS
  - name: MM_SERVICESETTINGS_FRAMEANCESTORS
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_SERVICESETTINGS_FRAMEANCESTORS
  - name: MM_TARUVISETTINGS_ENABLE
