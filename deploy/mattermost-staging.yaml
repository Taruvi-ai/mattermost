      secretKeyRef:
        name: mm-infisical
        key: MM_TARUVISETTINGS_ENABLE
  - name: MM_TARUVISETTINGS_OVERRIDEHOST
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_TARUVISETTINGS_OVERRIDEHOST
  - name: MM_TARUVISETTINGS_TARUVISERVERURL
    valueFrom:
      secretKeyRef:
        name: mm-infisical
        key: MM_TARUVISETTINGS_TARUVISERVERURL
  - name: MM_TARUVISETTINGS_USERENDPOINT
    valueFrom:
