# Applied by hand by a cluster admin; the deploy jobs must not apply this file.
# The EKS access entry for role github-actions-taruvi-mattermost-deploy maps
# it to the taruvi-mattermost-deployer group bound here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taruvi-mattermost-deployer
  namespace: mattermost
rules:
- apiGroups: ["installation.mattermost.com"]
  resources: ["mattermosts"]
  resourceNames: ["mattermost-staging", "mattermost-production"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["mm-infisical", "mm-chatprod-infisical"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taruvi-mattermost-deployer
  namespace: mattermost
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: taruvi-mattermost-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: taruvi-mattermost-deployer
