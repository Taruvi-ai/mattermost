# .github/workflows/harbor-push.yml applies this file on every deploy after
# replacing __DEPLOY_COMMIT_SHA__ with the commit SHA. The image tag (prod)
# stays the same, so that marker is what makes Kubernetes replace the pod and
# pull the newest image. Applying this file by hand also restarts the pod.
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost-production
  namespace: mattermost
spec:
  image: 150356453157.dkr.ecr.us-east-2.amazonaws.com/taruvi/mattermost
  version: prod
  replicas: 2
  imagePullPolicy: Always
  ingress:
    enabled: true
    host: chatprod.taruvi.app
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
      nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
  database:
    external:
      secret: mm-chatprod-db-secret
  fileStore:
    external:
      bucket: mattermost-taruviprod
      secret: mm-chatprod-s3-secret
      url: s3.amazonaws.com
  scheduling:
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 4Gi
  mattermostEnv:
  - name: DEPLOY_COMMIT_SHA
    value: "__DEPLOY_COMMIT_SHA__"
  - name: MM_FILESETTINGS_AMAZONS3SSE
    value: 'true'
  - name: MM_FILESETTINGS_AMAZONS3REGION
    value: us-east-2
  - name: MM_FILESETTINGS_AMAZONS3ENDPOINT
    value: s3.us-east-2.amazonaws.com
  - name: MM_SQLSETTINGS_DATASOURCE
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_SQLSETTINGS_DATASOURCE
  - name: MM_TARUVISETTINGS_ENABLE
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_TARUVISETTINGS_ENABLE
  - name: MM_TARUVISETTINGS_OVERRIDEHOST
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_TARUVISETTINGS_OVERRIDEHOST
  - name: MM_TARUVISETTINGS_TARUVISERVERURL
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_TARUVISETTINGS_TARUVISERVERURL
  - name: MM_TARUVISETTINGS_USERENDPOINT
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_TARUVISETTINGS_USERENDPOINT
  - name: MM_TARUVISETTINGS_AUTHENDPOINT
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_TARUVISETTINGS_AUTHENDPOINT
  - name: MM_TARUVISETTINGS_CONNECTIONTIMEOUT
    valueFrom:
      secretKeyRef:
        name: mm-chatprod-infisical
        key: MM_TARUVISETTINGS_CONNECTIONTIMEOUT
