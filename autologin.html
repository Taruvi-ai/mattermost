<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #191B1F;
    --icon-color: #fff;
    --hint-color: rgba(255,255,255,0.38);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fff;
      --icon-color: #1E325C;
      --hint-color: rgba(30,50,92,0.38);
    }
  }

  body {
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    cursor: pointer;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Open Sans', 'Segoe UI', sans-serif;
    transition: background 0.2s;
  }

  body:active { background: color-mix(in srgb, var(--bg) 92%, var(--icon-color)); }

  .icon {
    color: var(--icon-color);
    animation: pulse 2.4s ease-in-out infinite;
    opacity: 0;
    animation-delay: 0.2s;
    animation-fill-mode: forwards;
  }

  @keyframes pulse {
    0%   { opacity: 0.6; transform: scale(1); }
    50%  { opacity: 1;   transform: scale(1.04); }
    100% { opacity: 0.6; transform: scale(1); }
  }

  .hint {
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--hint-color);
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .hint.visible { opacity: 1; }
</style>
</head>
<body onclick="connect()">

  <!-- Chat bubble icon -->
  <svg class="icon" width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="currentColor" fill-opacity="0.9"/>
    <circle cx="8" cy="10" r="1.2" fill="var(--bg)"/>
    <circle cx="12" cy="10" r="1.2" fill="var(--bg)"/>
    <circle cx="16" cy="10" r="1.2" fill="var(--bg)"/>
  </svg>

  <span class="hint" id="hint">Tap anywhere to open</span>

<script>
  var pending = null;
  var loginAttempted = false;
  var hintTimer = setTimeout(function() {
    document.getElementById('hint').classList.add('visible');
  }, 1200);

  if (document.requestStorageAccess) {
    document.requestStorageAccess().catch(function() {});
  }

  window.addEventListener("message", function(e) {
    var ok = e.origin.endsWith(".taruvi.space") || e.origin.endsWith(".taruvi.app");
    if (!ok || !e.data || e.data.type !== "mm-login") return;
    if (loginAttempted) return; // ignore duplicate postMessages
    loginAttempted = true;
    pending = e.data;

    if (document.requestStorageAccess) {
      document.requestStorageAccess()
        .then(function() {
          clearTimeout(hintTimer);
          doLogin();
        })
        .catch(function() {
          // Show hint immediately — user needs to tap
          document.getElementById('hint').classList.add('visible');
        });
    } else {
      doLogin();
    }
  });

  function doLogin() {
    fetch("/api/v4/users/login", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        "X-Requested-With": "XMLHttpRequest"
      },
      body: JSON.stringify({
        login_id: pending.loginId,
        password: pending.token,
        auth_type: "session"
      })
    }).then(function(r) {
      if (r.ok) {
        window.location.href = "/";
      } else {
        window.parent.postMessage({ type: "mm-login-failed" }, pending.origin || "*");
      }
    }).catch(function() {
      window.parent.postMessage({ type: "mm-login-failed" }, pending.origin || "*");
    });
  }

  function connect() {
    if (!pending) return;
    if (document.requestStorageAccess) {
      document.requestStorageAccess().then(doLogin).catch(doLogin);
    } else {
      doLogin();
    }
  }

  window.parent.postMessage({ type: "mm-bridge-ready" }, "*");
</script>
</body>
</html>
