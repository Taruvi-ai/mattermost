name: Build and Push to ECR Taruvi

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy: dev (staging) or main (production). Set "Use workflow from" to the same branch.'
        required: true
        type: string
        default: dev

concurrency:
  group: mattermost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # Only dev or main may be built; any other branch skips the whole run.
    if: contains(fromJSON('["dev","main"]'), inputs.branch || github.ref_name)
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Configure AWS credentials (ECR push role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-push-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-2

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          no-cache: true
          provenance: false
          # main -> prod, dev -> stag; each build overwrites that fixed tag
          tags: ${{ steps.ecr-login.outputs.registry }}/taruvi/mattermost:${{ (inputs.branch || github.ref_name) == 'main' && 'prod' || 'stag' }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (inputs.branch || github.ref_name) == 'dev'
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-mattermost-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy Mattermost staging
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|__DEPLOY_COMMIT_SHA__|${COMMIT_SHA}|" deploy/mattermost-staging.yaml
          kubectl apply -f deploy/mattermost-staging.yaml

      - name: Wait for rollout and check the site
        run: |
          sleep 60
          kubectl rollout status deployment mattermost-staging --timeout=900s -n mattermost
          curl -fsS --retry 10 --retry-delay 10 https://chatstag.taruvi.app/api/v4/system/ping

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (inputs.branch || github.ref_name) == 'main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-mattermost-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy Mattermost production
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|__DEPLOY_COMMIT_SHA__|${COMMIT_SHA}|" deploy/mattermost-production.yaml
          kubectl apply -f deploy/mattermost-production.yaml

      - name: Wait for rollout and check the site
        run: |
          sleep 60
          kubectl rollout status deployment mattermost-production --timeout=900s -n mattermost
          curl -fsS --retry 10 --retry-delay 10 https://chatprod.taruvi.app/api/v4/system/ping
