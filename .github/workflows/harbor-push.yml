name: Build and Push to Harbor

on:
  push:
    branches:
      - mattermost-taruvi
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          MM_SQLSETTINGS_DATASOURCE=${{ secrets.MM_SQLSETTINGS_DATASOURCE }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: repo.eoxvantage.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push
        run: |
          cd server/build
          docker buildx build --platform linux/amd64 --push \
            -t repo.eoxvantage.com/mattermost/mattermost:latest \
            -t repo.eoxvantage.com/mattermost/mattermost:${{ github.sha }} \
            .
