name: Build and Push to Harbor

on:
  push:
    branches:
      - mattermost-taruvi
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          MM_SQLSETTINGS_DATASOURCE=${{ secrets.MM_SQLSETTINGS_DATASOURCE }}
          EOF

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: repo.eoxvantage.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: server/build
          file: server/build/Dockerfile
          push: true
          cache-from: type=registry,ref=repo.eoxvantage.com/taruvi/mattermost:buildcache
          cache-to: type=registry,ref=repo.eoxvantage.com/taruvi/mattermost:buildcache,mode=max
          tags: |
            repo.eoxvantage.com/taruvi/mattermost:latest
            repo.eoxvantage.com/taruvi/mattermost:${{ github.sha }}
