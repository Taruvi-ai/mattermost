name: Build and Push to Harbor

on:
  push:
    branches:
      - mattermost-taruvi
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fetch secrets from Infisical
      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-test
          project-slug: ${{ vars.MATTERMOST_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Set environment variables for Harbor login
        run: cat .env >> $GITHUB_ENV

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: repo.eoxvantage.com
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: server/build
          file: server/build/Dockerfile
          push: true
          cache-from: type=registry,ref=repo.eoxvantage.com/taruvi/mattermost:buildcache
          cache-to: type=registry,ref=repo.eoxvantage.com/taruvi/mattermost:buildcache,mode=max
          tags: |
            repo.eoxvantage.com/taruvi/mattermost:latest
            repo.eoxvantage.com/taruvi/mattermost:${{ github.sha }}
