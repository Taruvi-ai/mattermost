name: Build and Push to Harbor Taruvi

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-test
          project-slug: ${{ vars.TARUVI_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: repo.eoxvantage.com
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          no-cache: true
          tags: |
            repo.eoxvantage.com/taruvi/mattermost:${{ github.ref_name }}
            repo.eoxvantage.com/taruvi/mattermost:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event.inputs.environment == 'staging'
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-test
          project-slug: ${{ vars.TARUVI_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-mattermost-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Create/Update Infisical Secret
        run: |
          printenv | grep '^MM_' > /tmp/mm.env
          kubectl create secret generic mm-infisical --from-env-file=/tmp/mm.env -n mattermost --dry-run=client -o yaml | kubectl apply -f -
          
      - name: Deploy Mattermost staging
        run: |
          sed -i "s/^  version: .*/  version: ${{ github.sha }}/" deploy/mattermost-staging.yaml
          kubectl apply -f deploy/mattermost-staging.yaml
          kubectl rollout status deployment mattermost-staging --timeout=600s -n mattermost

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.environment == 'production'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-prod
          project-slug: ${{ vars.TARUVI_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-mattermost-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Create/Update Infisical Secret
        run: |
          printenv | grep '^MM_' > /tmp/mm.env
          kubectl create secret generic mm-chatprod-infisical --from-env-file=/tmp/mm.env -n mattermost --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Deploy Mattermost production
        run: |
          sed -i "s/^  version: .*/  version: ${{ github.sha }}/" deploy/mattermost-production.yaml
          kubectl apply -f deploy/mattermost-production.yaml
          kubectl rollout status deployment mattermost-production --timeout=600s -n mattermost
