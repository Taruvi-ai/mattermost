name: Build and Push to Harbor Taruvi

on:
  push:
    branches:
      - mattermost-taruvi
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-test
          project-slug: ${{ vars.TARUVI_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: repo.eoxvantage.com
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: repo.eoxvantage.com/taruvi/mattermost:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    steps:
      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-test
          project-slug: ${{ vars.TARUVI_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Create/Update Infisical Secret
        run: |
          printenv | grep '^MM_' > /tmp/mm.env
          kubectl create secret generic mm-infisical --from-env-file=/tmp/mm.env -n mattermost --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Update deployment to force pull and add envFrom
        run: |
          kubectl patch deployment mattermost-staging -n mattermost --type=strategic -p='{"spec":{"template":{"spec":{"containers":[{"name":"mattermost","image":"repo.eoxvantage.com/taruvi/mattermost:latest","imagePullPolicy":"Always","envFrom":[{"secretRef":{"name":"mm-infisical"}}]}]}}}}'
          kubectl rollout restart deployment mattermost-staging -n mattermost
          kubectl rollout status deployment mattermost-staging --timeout=600s -n mattermost

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Get environment variables from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: taruvi-prod
          project-slug: ${{ vars.TARUVI_PROJECT_SLUG }}
          secret-path: /Mattermost
          domain: "https://environment.eoxvantage.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Create/Update Infisical Secret
        run: |
          printenv | grep '^MM_' > /tmp/mm.env
          kubectl create secret generic mm-chatprod-infisical --from-env-file=/tmp/mm.env -n mattermost --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Update deployment to force pull and add envFrom
        run: |
          kubectl patch deployment mattermost-production -n mattermost --type=strategic -p='{"spec":{"template":{"spec":{"containers":[{"name":"mattermost","image":"repo.eoxvantage.com/taruvi/mattermost:latest","imagePullPolicy":"Always","envFrom":[{"secretRef":{"name":"mm-chatprod-infisical"}}]}]}}}}'
          kubectl rollout restart deployment mattermost-production -n mattermost
          kubectl rollout status deployment mattermost-production --timeout=600s -n mattermost
