name: Build and Push to ECR Taruvi

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: mattermost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide image tags
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF" = "refs/heads/main" ]; then ENV=prod; else ENV=stag; fi
          else
            if [ "$INPUT_ENV" = "production" ]; then ENV=prod; else ENV=stag; fi
          fi
          if [ "$ENV" = "prod" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "Production images can only be built from main" >&2; exit 1
          fi
          if [ "$ENV" = "stag" ] && [ "$REF" != "refs/heads/dev" ]; then
            echo "Staging images can only be built from dev" >&2; exit 1
          fi
          echo "env_tag=${ENV}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${ENV}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (ECR push role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-push-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-2

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          no-cache: true
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/taruvi/mattermost:${{ steps.tag.outputs.env_tag }}
            ${{ steps.ecr-login.outputs.registry }}/taruvi/mattermost:${{ steps.tag.outputs.sha_tag }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event.inputs.environment == 'staging'
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-mattermost-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy Mattermost staging
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|__DEPLOY_COMMIT_SHA__|${COMMIT_SHA}|" deploy/mattermost-staging.yaml
          kubectl apply -f deploy/mattermost-staging.yaml

      - name: Wait for rollout and check the site
        run: |
          sleep 60
          kubectl rollout status deployment mattermost-staging --timeout=900s -n mattermost
          curl -fsS --retry 10 --retry-delay 10 https://chatstag.taruvi.app/api/v4/system/ping

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.environment == 'production'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-mattermost-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kube config
        run: aws eks update-kubeconfig --name ${{ secrets.AWS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Deploy Mattermost production
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sed -i "s|__DEPLOY_COMMIT_SHA__|${COMMIT_SHA}|" deploy/mattermost-production.yaml
          kubectl apply -f deploy/mattermost-production.yaml

      - name: Wait for rollout and check the site
        run: |
          sleep 60
          kubectl rollout status deployment mattermost-production --timeout=900s -n mattermost
          curl -fsS --retry 10 --retry-delay 10 https://chatprod.taruvi.app/api/v4/system/ping
